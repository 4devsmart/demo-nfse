; Desenvolvimento. Entra em conf.d, depois do php.ini-development que o
; Dockerfile poe no lugar.

memory_limit = 512M
upload_max_filesize = 16M
post_max_size = 16M

; Mesma razao do php.prod.ini: o relogio do FrankenPHP conta espera de rede, e
; o default de 30s mata a transmissao antes do timeout fiscal de 120s. Em
; desenvolvimento isso apareceria como uma nota travada em "DPS gerada" sem
; explicacao nenhuma — que e o pior lugar para aprender essa regra.
max_execution_time = 180

variables_order = "EGPCS"

opcache.enable = 0
display_errors = On
log_errors = On
error_log = /proc/self/fd/2

; Cobertura de codigo (PHPUnit --coverage e Infection). `pcov.directory` limita
; a instrumentacao a app/: vendor/ e tests/ nao entram na conta nem no custo.
pcov.enabled = 1
pcov.directory = /app/app
