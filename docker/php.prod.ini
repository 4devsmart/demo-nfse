; Producao. Este arquivo entra em conf.d e e lido DEPOIS do php.ini-production
; que o Dockerfile poe no lugar: aqui ficam so os valores em que esta aplicacao
; precisa divergir do padrao recomendado pelo PHP.

memory_limit = 256M
upload_max_filesize = 16M
post_max_size = 16M

; O relogio do FrankenPHP conta tempo de parede, INCLUSIVE espera de rede — ao
; contrario do timer classico do PHP em Unix, que ignora I/O. Medido nesta
; imagem: um `sleep(40)` morre em 30,0s exatos, que e o default.
;
; Transmitir fala com a prefeitura e espera ate FISCAL_API_TIMEOUT (120s por
; padrao, em config/fiscal.php). Se o PHP matar o processo antes disso, a Action
; nao chega ao `catch (DesfechoIndeterminado)` que marca a nota — e sobra uma
; DPS gerada com uma NFS-e possivelmente autorizada do outro lado, sem registro
; nenhum da duvida. E o unico cenario que este sistema inteiro existe para
; evitar. O limite do PHP precisa SOBRAR sobre o timeout fiscal, nao caber
; dentro dele. `LimitesDeTempoTest` falha se a margem sumir.
max_execution_time = 180

; O php.ini-production traz "GPCS": sem o E, `$_ENV` nasce vazio. Aqui as
; variaveis do compose sao o unico canal de configuracao, e o default compilado
; do PHP ja era "EGPCS" — isto preserva o comportamento em vez de mudar.
variables_order = "EGPCS"

; display_errors Off sem log_errors On e o erro sumindo em silencio: nem na tela,
; nem em lugar nenhum. O container loga em stderr, que e de onde
; `docker compose logs` le.
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Nao anunciar a versao do PHP no cabecalho da resposta.
expose_php = Off

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
