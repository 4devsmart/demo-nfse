version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'Atualiza'
    groups:
      producao:
        dependency-type: production
      desenvolvimento:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'Atualiza'

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    commit-message:
      prefix: 'Atualiza'
