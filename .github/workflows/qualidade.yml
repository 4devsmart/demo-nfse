name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Estilo, tipos, camadas e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, zip, bcmath, pcntl, pdo_sqlite, sqlite3, openssl, mbstring
          coverage: none
          ini-values: memory_limit=1G

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      # Cada verificacao em um passo proprio: assim o painel do GitHub diz qual
      # delas quebrou, em vez de mostrar so "composer qualidade falhou".
      - name: Estilo (Pint)
        run: vendor/bin/pint --test

      - name: Tipos (PHPStan nivel 8)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Camadas (Deptrac)
        run: vendor/bin/deptrac analyse --no-progress

      - name: Testes (PHPUnit)
        run: php artisan test
